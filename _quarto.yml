project:
  type: default
  output-dir: output
  render:
    - manuscript/proms.qmd
  post-render:
    # knitr::include_graphics() in tbl-anx-dep-top makes Quarto copy
    # output/tables/ into output-dir, creating output/output/tables/.
    - Rscript -e "unlink('output/output', recursive = TRUE)"

execute-dir: project
